<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Pendataan Masyarakat</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #2c3e50;
      color: #fff;
      height: 100vh;
      position: fixed;
      top: 0; left: 0;
      display: flex;
      flex-direction: column;
    }
    .sidebar h2 {
      text-align: center;
      padding: 20px 0;
      border-bottom: 1px solid #34495e;
      margin: 0;
    }
    .sidebar a {
      color: #fff;
      padding: 15px 20px;
      text-decoration: none;
      display: block;
    }
    .sidebar a:hover {
      background: #34495e;
    }

    /* Main content */
    .main {
      margin-left: 220px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      background: #2980b9;
      color: #fff;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Content */
    .content {
      flex: 1;
      padding: 20px;
      background: #f4f6f9;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 5px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #2980b9;
      color: #fff;
    }
    tr:hover {
      background: #f1f1f1;
    }
    button {
      padding: 5px 10px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-edit { background: #f39c12; color: #fff; }
    .btn-delete { background: #e74c3c; color: #fff; }
    .btn-add { 
      background: #27ae60; 
      color: #fff; 
      padding: 10px 15px; 
      text-decoration: none; 
      border-radius: 5px; 
      display: inline-block; 
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>📊 Dashboard</h2>
    <a href="index.html">Daftar Data</a>
    <a href="form.html">Tambah Data</a>
  </div>

  <!-- Main content -->
  <div class="main">
    <!-- Navbar -->
    <div class="navbar">
      <div>📌 Pendataan Masyarakat Jorong Koto Baru </div>
    </div>

    <!-- Content -->
    <div class="content">
      <h1>Daftar Data Masyarakat</h1>
      <a href="form.html" class="btn-add">+ Tambah Data</a>

      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>NIK</th>
            <th>Jenis Kelamin</th>
            <th>Tanggal Lahir</th>
            <th>Alamat</th>
            <th>Pekerjaan</th>
            <th>No HP</th>
            <th>Email</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="dataBody">
          <!-- Data dari server akan dimuat di sini -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function formatTanggal(tgl) {
      if (!tgl) return "-";
      const d = new Date(tgl);
      return d.toLocaleDateString("id-ID", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    async function loadData() {
      const res = await fetch('/api/masyarakat');
      const data = await res.json();
      const tbody = document.getElementById('dataBody');
      tbody.innerHTML = '';

      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.nama}</td>
          <td>${item.nik}</td>
          <td>${item.jenis_kelamin}</td>
          <td>${formatTanggal(item.tanggal_lahir)}</td>
          <td>${item.alamat}</td>
          <td>${item.pekerjaan}</td>
          <td>${item.no_hp}</td>
          <td>${item.email}</td>
          <td>
            <button class="btn-edit" onclick="editData(${item.id})">Edit</button>
            <button class="btn-delete" onclick="deleteData(${item.id})">Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteData(id) {
      if (!confirm("Yakin mau hapus data ini?")) return;
      const res = await fetch(`/api/masyarakat/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadData();
      } else {
        alert("Gagal menghapus data!");
      }
    }

    function editData(id) {
      window.location.href = `form.html?id=${id}`;
    }

    loadData();
  </script>
</body>
</html>
